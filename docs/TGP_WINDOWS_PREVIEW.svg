<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#061822" flood-opacity=".09"/></filter>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .nav { fill:#ACD1EC; font-size:14px; }
      .navTitle { fill:#fff; font-size:15px; font-weight:700; }
      .muted { fill:#527086; font-size:14px; }
      .small { fill:#6A8192; font-size:12px; }
      .heading { fill:#0A2B50; font-size:30px; font-weight:700; }
      .cardTitle { fill:#0A2B50; font-size:17px; font-weight:700; }
    </style>
  </defs>
  <rect width="1440" height="900" rx="18" fill="#EBF3FD"/>
  <rect width="270" height="900" rx="18" fill="#061822"/>
  <rect x="252" width="18" height="900" fill="#061822"/>
  <image x="28" y="25" width="64" height="64" xlink:href="../branding/tgp-field/source/tgp-field-icon-master.png" preserveAspectRatio="xMidYMid slice"/>
  <text x="108" y="54" fill="#fff" font-size="22" font-weight="700">TGP-FIELD</text>
  <text x="108" y="75" fill="#ACD1EC" font-size="13">TerraGIS Pro</text>
  <line x1="0" y1="111" x2="270" y2="111" stroke="#1C4568"/>
  <rect x="15" y="132" width="240" height="68" rx="12" fill="#17466E"/>
  <rect x="15" y="149" width="5" height="34" rx="2" fill="#43A047"/>
  <text class="navTitle" x="38" y="159">Proiectele mele</text><text class="nav" x="38" y="181">Spații de lucru QGIS</text>
  <text class="navTitle" x="38" y="240">Instrumente teren</text><text class="nav" x="38" y="262">Ridicare și navigare</text>
  <text class="navTitle" x="38" y="321">Hărți și straturi</text><text class="nav" x="38" y="343">Date locale și online</text>
  <text class="navTitle" x="38" y="402">Offline și MEGA</text><text class="nav" x="38" y="424">Exporturi și transferuri</text>
  <rect x="18" y="734" width="234" height="103" rx="14" fill="#123B61"/>
  <text class="nav" x="36" y="762">Furnizor cloud</text><circle cx="41" cy="787" r="6" fill="#CA9315"/><text class="navTitle" x="56" y="792">MEGA neconfigurat</text><text class="nav" x="36" y="817">0 transferuri în așteptare</text>

  <rect x="270" width="1170" height="82" fill="#fff"/>
  <line x1="270" y1="82" x2="1440" y2="82" stroke="#D4E1ED"/>
  <text x="309" y="38" fill="#0A2B50" font-size="21" font-weight="700">Proiectele mele</text><text class="small" x="309" y="61">Spațiu desktop · Windows</text>
  <rect x="1223" y="24" width="168" height="36" rx="18" fill="#E8F0F7"/><text x="1262" y="47" fill="#2A6497" font-size="12" font-weight="700">Niciun proiect deschis</text>

  <text class="heading" x="310" y="141">Spații de lucru pregătite pentru teren</text>
  <text class="muted" x="310" y="170">Deschide un proiect QGIS, importă date GIS locale sau creează un proiect nou.</text>
  <rect x="1090" y="120" width="147" height="43" rx="9" fill="#fff" stroke="#ACD1EC"/><text x="1110" y="147" fill="#0A2B50" font-size="13" font-weight="700">Deschide proiect</text>
  <rect x="1250" y="120" width="141" height="43" rx="9" fill="#145A1C"/><text x="1276" y="147" fill="#fff" font-size="13" font-weight="700">Proiect nou</text>

  <g filter="url(#shadow)">
    <rect x="310" y="207" width="340" height="111" rx="15" fill="#fff"/><rect x="329" y="238" width="8" height="49" rx="4" fill="#2A6497"/><text class="small" x="354" y="246">Proiecte recente</text><text x="354" y="283" fill="#0A2B50" font-size="31" font-weight="700">3</text>
    <rect x="670" y="207" width="340" height="111" rx="15" fill="#fff"/><rect x="689" y="238" width="8" height="49" rx="4" fill="#145A1C"/><text class="small" x="714" y="246">Exporturi offline</text><text x="714" y="283" fill="#0A2B50" font-size="31" font-weight="700">2</text>
    <rect x="1030" y="207" width="361" height="111" rx="15" fill="#fff"/><rect x="1049" y="238" width="8" height="49" rx="4" fill="#CA9315"/><text class="small" x="1074" y="246">Transferuri în așteptare</text><text x="1074" y="283" fill="#0A2B50" font-size="31" font-weight="700">1</text>
  </g>
  <text class="cardTitle" x="310" y="367">Deschise recent</text>
  <g filter="url(#shadow)">
    <rect x="310" y="394" width="337" height="164" rx="15" fill="#fff"/><rect x="310" y="394" width="7" height="164" rx="3" fill="#145A1C"/><text x="337" y="426" fill="#145A1C" font-size="11" font-weight="700">PROIECT LOCAL</text><text class="cardTitle" x="337" y="461">Inventariere rețea apă</text><text class="small" x="337" y="488">D:/TGP/Pitesti/retea_apa.qgz</text><text x="337" y="528" fill="#2A6497" font-size="13" font-weight="700">Deschide proiectul  →</text>
    <rect x="670" y="394" width="337" height="164" rx="15" fill="#fff"/><rect x="670" y="394" width="7" height="164" rx="3" fill="#2A6497"/><text x="697" y="426" fill="#2A6497" font-size="11" font-weight="700">PROIECT CLOUD</text><text class="cardTitle" x="697" y="461">Cadastru sistematic</text><text class="small" x="697" y="488">/TGP-FIELD/Arges/cadastru</text><text x="697" y="528" fill="#2A6497" font-size="13" font-weight="700">Deschide proiectul  →</text>
    <rect x="1030" y="394" width="361" height="164" rx="15" fill="#fff"/><rect x="1030" y="394" width="7" height="164" rx="3" fill="#145A1C"/><text x="1057" y="426" fill="#145A1C" font-size="11" font-weight="700">PROIECT LOCAL</text><text class="cardTitle" x="1057" y="461">PUZ – zona industrială</text><text class="small" x="1057" y="488">D:/TGP/Urbanism/puz_industrial.qgz</text><text x="1057" y="528" fill="#2A6497" font-size="13" font-weight="700">Deschide proiectul  →</text>
  </g>

  <rect x="310" y="602" width="1081" height="230" rx="17" fill="#fff" stroke="#D4E1ED"/>
  <text class="cardTitle" x="338" y="640">Instrumente disponibile</text>
  <text class="muted" x="338" y="667">Funcții GIS și GNSS accesibile din același spațiu de lucru TGP-FIELD</text>
  <g>
    <rect x="338" y="698" width="157" height="91" rx="12" fill="#EBF3FD"/><text x="356" y="730" fill="#0A2B50" font-size="14" font-weight="700">GNSS / RTK</text><text class="small" x="356" y="754">Bluetooth · NTRIP</text><circle cx="469" cy="772" r="6" fill="#43A047"/>
    <rect x="512" y="698" width="157" height="91" rx="12" fill="#EBF3FD"/><text x="530" y="730" fill="#0A2B50" font-size="14" font-weight="700">GeoPackage</text><text class="small" x="530" y="754">Editare offline</text><circle cx="643" cy="772" r="6" fill="#43A047"/>
    <rect x="686" y="698" width="157" height="91" rx="12" fill="#EBF3FD"/><text x="704" y="730" fill="#0A2B50" font-size="14" font-weight="700">MBTiles</text><text class="small" x="704" y="754">Hartă offline</text><circle cx="817" cy="772" r="6" fill="#43A047"/>
    <rect x="860" y="698" width="157" height="91" rx="12" fill="#EBF3FD"/><text x="878" y="730" fill="#0A2B50" font-size="14" font-weight="700">Tracking</text><text class="small" x="878" y="754">Trasee în teren</text><circle cx="991" cy="772" r="6" fill="#43A047"/>
    <rect x="1034" y="698" width="157" height="91" rx="12" fill="#EBF3FD"/><text x="1052" y="730" fill="#0A2B50" font-size="14" font-weight="700">Stakeout</text><text class="small" x="1052" y="754">Distanță · azimut</text><circle cx="1165" cy="772" r="6" fill="#43A047"/>
    <rect x="1208" y="698" width="155" height="91" rx="12" fill="#EBF3FD"/><text x="1226" y="730" fill="#0A2B50" font-size="14" font-weight="700">MEGA</text><text class="small" x="1226" y="754">Coadă offline</text><circle cx="1337" cy="772" r="6" fill="#CA9315"/>
  </g>
</svg>
